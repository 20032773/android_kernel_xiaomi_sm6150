name: Build minatok20

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "BakaSU (formerly ReSukiSU) branch / tag / commit"
        required: true
        default: "main"
      susfs:
        description: "Enable SUSFS (inline hook). Off = KernelSU manual hook"
        type: boolean
        default: true
      release:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same clang as LineageOS 23.2 (build/soong ClangDefaultVersion)
  CLANG_VERSION: clang-r563880c
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r563880c.tar.gz
  MKDTBOIMG_URL: https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT
  ANYKERNEL3_REPO: https://github.com/osm0sis/AnyKernel3
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git curl make bc bison flex libssl-dev libelf-dev python3 cpio kmod \
            zip unzip ccache lz4 xz-utils perl rsync \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Restore clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: ${{ env.CLANG_VERSION }}

      - name: Download clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/clang"
          curl -fL --retry 3 -o "$RUNNER_TEMP/clang.tgz" "$CLANG_URL"
          tar -xzf "$RUNNER_TEMP/clang.tgz" -C "$RUNNER_TEMP/clang"
          rm -f "$RUNNER_TEMP/clang.tgz"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.CLANG_VERSION }}-susfs${{ inputs.susfs }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.CLANG_VERSION }}-susfs${{ inputs.susfs }}-
            ccache-${{ env.CLANG_VERSION }}-

      - name: Build kernel
        env:
          CLANG_DIR: ${{ runner.temp }}/clang
          KSU: "true"
          KSU_REF: ${{ inputs.ksu_ref }}
          SUSFS: ${{ inputs.susfs }}
          OUT: ${{ github.workspace }}/out
        run: |
          ccache -z
          bash minatok20/build.sh 2>&1 | tee build.log
          ccache -s

      - name: Build dtb and dtbo.img
        run: |
          curl -fsSL "$MKDTBOIMG_URL" | base64 -d > "$RUNNER_TEMP/mkdtboimg.py"
          bash minatok20/mkdtb.sh out "$RUNNER_TEMP/mkdtboimg.py"

      - name: Package AnyKernel3 zip
        id: pack
        run: |
          git clone --depth 1 "$ANYKERNEL3_REPO" ak3
          AK3_SHA=$(git -C ak3 rev-parse --short HEAD)
          rm -rf ak3/.git ak3/.github ak3/modules ak3/patch ak3/ramdisk ak3/README.md
          cp minatok20/anykernel.sh ak3/anykernel.sh
          cp out/arch/arm64/boot/Image.gz ak3/
          cp out/minatok20/dtb ak3/dtb
          cp out/minatok20/dtbo.img ak3/dtbo.img

          RELEASE=$(cat out/include/config/kernel.release)
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          KSU_SHA=$(git -C KernelSU rev-parse --short=12 HEAD)
          if [ "${{ inputs.susfs }}" = "true" ]; then VARIANT=susfs; else VARIANT=nosusfs; fi
          ZIP="minatok20-davinci-${VARIANT}-$(date -u +%Y%m%d)-${SHORT_SHA}.zip"

          cat > ak3/minatok20-build-info.txt <<EOF
          kernel.release: ${RELEASE}
          source: ${{ github.server_url }}/${{ github.repository }}/commit/$(git rev-parse HEAD)
          bakasu (formerly ReSukiSU): $(git -C KernelSU rev-parse HEAD)
          susfs: ${{ inputs.susfs }}
          clang: ${CLANG_VERSION}
          anykernel3: osm0sis/AnyKernel3@${AK3_SHA}
          EOF

          (cd ak3 && zip -r9 "../${ZIP}" . -x '.git*')
          sha256sum "$ZIP" | tee "${ZIP}.sha256"

          {
            echo "zip=${ZIP}"
            echo "release=${RELEASE}"
            echo "short_sha=${SHORT_SHA}"
            echo "ksu_sha=${KSU_SHA}"
            echo "variant=${VARIANT}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: |
            ${{ steps.pack.outputs.zip }}
            ${{ steps.pack.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - name: Publish release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="minatok20-${{ steps.pack.outputs.variant }}-${{ github.run_number }}-${{ steps.pack.outputs.short_sha }}"
          cat > notes.md <<EOF
          Kernel: \`${{ steps.pack.outputs.release }}\`
          Source commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          BakaSU (formerly ReSukiSU): \`${{ steps.pack.outputs.ksu_sha }}\`
          SUSFS: ${{ inputs.susfs }}
          Clang: ${CLANG_VERSION}

          Flash with LineageOS Recovery: Apply update -> Apply from ADB -> \`adb sideload <zip>\`.
          Back up your stock boot.img and dtbo.img first (see README).
          EOF
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes-file notes.md \
            "${{ steps.pack.outputs.zip }}" "${{ steps.pack.outputs.zip }}.sha256"
